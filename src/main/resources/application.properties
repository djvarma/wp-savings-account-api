spring.application.name=savings-account-api

# Defaults match compose.yaml. Override with env vars in other environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/savings}
spring.datasource.username=${DB_USERNAME:savings}
spring.datasource.password=${DB_PASSWORD:savings}
# Fail fast (and return a 503) when the database is down, rather than holding the request for the default 30s
spring.datasource.hikari.connection-timeout=3000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

spring.cache.type=redis

# /actuator/health shows the status of each component (db, redis) but not connection details
management.endpoint.health.show-components=always
# /actuator/health/readiness only depends on the database. Redis is just a cache, the API
# keeps working without it, so it shouldn't take the instance out of a load balancer.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

app.accounts.max-per-customer=5
app.cache.accounts-ttl=10m
