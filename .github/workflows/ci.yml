name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Integration tests use Testcontainers, Docker is already available on GitHub's Ubuntu runners
      - name: Build and test
        run: ./mvnw -B verify
